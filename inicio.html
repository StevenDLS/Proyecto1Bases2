<!DOCTYPE html>
<html>
    <head>
        <title>
            Sistema de cursos
        </title>
        <style>
            body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #333;
        }

        .botones {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
        </style>
    </head>
    <body>
        <h1>Sistema de cursos</h1>

        <div class="botones">
            <button onclick="window.location.href='SignIn.html'">Iniciar sesión</button>
            <button onclick="window.location.href='SignUp.html'">Registrarse</button>
        </div>
    </body>
    <script src="indice.js"> 

    </script>
</html>
