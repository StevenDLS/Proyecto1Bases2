<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
          <a href="start.html" class="text-decoration-none">
            <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
            <h2 class="navbar-brand mt-2">TEC Digitalito</h2>
          </a>
        </div>
        <div class="card">
          <div class="card-header text-center py-3">
            <h4 class="mb-0"><i class="bi bi-key me-2"></i>Recuperar Contraseña</h4>
          </div>
          <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert" aria-live="polite"></div>
            <p class="text-muted">Ingresa tu nombre de usuario y te enviaremos un enlace para restablecer tu contraseña.</p>
            <form id="forgotForm">
              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username"
                  aria-label="Nombre de usuario" required>
              </div>
              <button type="submit" class="btn btn-primary w-100" aria-label="Enviar enlace de recuperación">
                Enviar enlace
              </button>
            </form>
            <hr>
            <p class="text-center mb-0"><a href="SignIn.html">Volver al inicio de sesión</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const alertBox = document.getElementById('alertBox');
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        alertBox.className = 'alert alert-success';
        alertBox.textContent = data.message;
        alertBox.classList.remove('d-none');
      } catch {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Error al procesar la solicitud';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
