<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Resultados — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center mb-4">
      <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm me-3" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="mb-0"><i class="bi bi-graph-up me-2"></i>Mis Resultados</h3>
    </div>
    <div id="resultsContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const courseId = getQueryParam('courseId');
    if (!courseId) window.location.href = 'dashboard-student.html';

    checkAuth();

    fetch(`/api/evaluations/results/${courseId}/me`)
      .then(r => r.json())
      .then(async results => {
        const container = document.getElementById('resultsContainer');
        if (!results.length) {
          container.innerHTML = '<div class="alert alert-info">No has realizado evaluaciones en este curso aún.</div>';
          return;
        }
        container.innerHTML = results.map(r => `
          <div class="card mb-3">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-md-2 text-center">
                  <div class="score-circle ${r.score >= 70 ? 'score-pass' : 'score-fail'} mx-auto" style="width:70px;height:70px;font-size:1.2rem;">
                    ${Math.round(r.score)}%
                  </div>
                </div>
                <div class="col-md-10">
                  <h5 class="mb-1">Evaluación</h5>
                  <p class="text-muted mb-1">
                    ${r.correctCount} de ${r.totalQuestions} respuestas correctas
                  </p>
                  <small class="text-muted">Enviado: ${formatDateTime(r.submittedAt)}</small>
                  <span class="badge ms-2 bg-${r.score >= 70 ? 'success' : 'danger'}">
                    ${r.score >= 70 ? 'Aprobado' : 'Reprobado'}
                  </span>
                </div>
              </div>
            </div>
          </div>`).join('');
      });

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
