<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes del Curso — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center mb-4">
      <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm me-3" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="mb-0"><i class="bi bi-people me-2"></i>Estudiantes del Curso</h3>
    </div>
    <div id="studentsContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const courseId = getQueryParam('courseId');
    if (!courseId) window.location.href = 'dashboard-student.html';

    checkAuth().then(async user => {
      // Teachers use /api/courses/:courseId/students, students use /api/enrollment/:courseId/students
      const url = (user.role === 'teacher' || user.role === 'admin')
        ? `/api/courses/${courseId}/students`
        : `/api/enrollment/${courseId}/students`;

      const res = await fetch(url);
      const container = document.getElementById('studentsContainer');

      if (!res.ok) {
        container.innerHTML = '<div class="alert alert-danger">No tienes acceso a esta lista.</div>';
        return;
      }
      const students = await res.json();
      if (!students.length) {
        container.innerHTML = '<div class="alert alert-info">No hay estudiantes matriculados aún.</div>';
        return;
      }
      container.innerHTML = `
        <p class="text-muted mb-3">${students.length} estudiante(s) matriculado(s)</p>
        <div class="row g-3">
          ${students.map(s => `
            <div class="col-md-3">
              <div class="card p-3 text-center">
                <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white mx-auto mb-2" style="width:56px;height:56px;font-size:1.5rem;">${s.fullName[0]}</div>
                <strong>${s.fullName}</strong>
                <small class="text-muted">@${s.username}</small>
                <a href="profile.html?id=${s.userId}" class="btn btn-outline-primary btn-sm mt-2"
                  aria-label="Ver perfil de ${s.fullName}">Ver perfil</a>
              </div>
            </div>`).join('')}
        </div>`;
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
