<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Usuarios — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="mb-3"><i class="bi bi-people me-2"></i>Buscar Usuarios</h3>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput"
            placeholder="Busca por nombre o usuario..." aria-label="Buscar usuarios" autofocus>
        </div>
      </div>
    </div>

    <!-- Solicitudes pendientes -->
    <div id="pendingSection" class="mb-4 d-none">
      <h5>Solicitudes de amistad pendientes</h5>
      <div id="pendingList" class="row g-2"></div>
    </div>

    <div id="resultsContainer" class="row g-3">
      <div class="col-12 text-center text-muted py-4">
        <i class="bi bi-people fs-1 opacity-25"></i>
        <p>Escribe para buscar usuarios</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentUser;
    checkAuth().then(user => {
      currentUser = user;
      loadPendingRequests();
    });

    async function loadPendingRequests() {
      const res = await fetch('/api/users/me/friend-requests');
      const requests = await res.json();
      if (!requests.length) return;
      document.getElementById('pendingSection').classList.remove('d-none');
      document.getElementById('pendingList').innerHTML = requests.map(u => `
        <div class="col-md-4">
          <div class="card p-3 d-flex flex-row align-items-center gap-3">
            <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white flex-shrink-0" style="width:40px;height:40px;">${u.fullName[0]}</div>
            <div class="flex-grow-1">
              <strong>${u.fullName}</strong><br>
              <small class="text-muted">@${u.username}</small>
            </div>
            <button class="btn btn-success btn-sm"
              onclick="acceptRequest('${u.userId}')"
              aria-label="Aceptar solicitud de ${u.fullName}">
              <i class="bi bi-check"></i>
            </button>
          </div>
        </div>`).join('');
    }

    async function acceptRequest(userId) {
      const res = await fetch(`/api/users/${userId}/accept-friend`, { method: 'POST' });
      if (res.ok) { showToast('Solicitud aceptada', 'success'); loadPendingRequests(); }
    }

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const q = e.target.value.trim();
      if (!q) {
        document.getElementById('resultsContainer').innerHTML = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-people fs-1 opacity-25"></i><p>Escribe para buscar usuarios</p></div>';
        return;
      }
      searchTimeout = setTimeout(() => searchUsers(q), 300);
    });

    async function searchUsers(q) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '<div class="col-12 text-center py-3"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Buscando...</span></div></div>';
      const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
      const users = await res.json();
      if (!users.length) {
        container.innerHTML = '<div class="col-12"><div class="alert alert-warning">No se encontraron usuarios.</div></div>';
        return;
      }
      container.innerHTML = users.filter(u => u.userId !== currentUser?.userId).map(u => `
        <div class="col-md-4">
          <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
              ${u.avatarFileId
                ? `<img src="/api/files/${u.avatarFileId}" alt="Foto de ${u.fullName}" class="rounded-circle" style="width:48px;height:48px;object-fit:cover;">`
                : `<div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white flex-shrink-0" style="width:48px;height:48px;">${u.fullName[0]}</div>`}
              <div class="flex-grow-1 min-w-0">
                <strong class="d-block">${u.fullName}</strong>
                <small class="text-muted">@${u.username}</small>
                <br><span class="badge badge-role-${u.role}">${u.role}</span>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <a href="profile.html?id=${u.userId}" class="btn btn-outline-primary btn-sm flex-grow-1"
                aria-label="Ver perfil de ${u.fullName}">
                <i class="bi bi-person"></i> Perfil
              </a>
              <button class="btn btn-outline-success btn-sm"
                onclick="sendRequest('${u.userId}', this)"
                aria-label="Enviar solicitud de amistad a ${u.fullName}">
                <i class="bi bi-person-plus"></i>
              </button>
            </div>
          </div>
        </div>`).join('');
    }

    async function sendRequest(toId, btn) {
      const res = await fetch(`/api/users/${toId}/friend-request`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        showToast('Solicitud enviada', 'success');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-check"></i>';
      } else {
        showToast(data.error || 'Error', 'danger');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
