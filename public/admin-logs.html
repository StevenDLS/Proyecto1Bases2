<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs del Sistema — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard-admin.html"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <div class="d-flex align-items-center mb-4">
      <a href="dashboard-admin.html" class="btn btn-outline-secondary btn-sm me-3" aria-label="Volver al dashboard">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="mb-0"><i class="bi bi-journal-text me-2"></i>Logs del Sistema</h3>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <label for="filterDate" class="form-label">Fecha</label>
        <input type="date" class="form-control" id="filterDate" aria-label="Filtrar por fecha">
      </div>
      <div class="col-md-3">
        <label for="filterEvent" class="form-label">Tipo de evento</label>
        <select class="form-select" id="filterEvent" aria-label="Filtrar por tipo de evento">
          <option value="">Todos</option>
          <option value="LOGIN_SUCCESS">Login exitoso</option>
          <option value="LOGIN_FAIL">Login fallido</option>
          <option value="LOGOUT">Logout</option>
          <option value="BLOCKED">Cuenta bloqueada</option>
          <option value="SUSPICIOUS">Actividad sospechosa</option>
        </select>
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" id="filterBtn" aria-label="Aplicar filtros">
          <i class="bi bi-search me-1"></i>Buscar
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-sm">
        <thead class="table-light">
          <tr>
            <th>Fecha/Hora</th>
            <th>Usuario</th>
            <th>Evento</th>
            <th>IP</th>
            <th>Dispositivo</th>
            <th>Detalles</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="6" class="text-center text-muted">Selecciona una fecha y haz clic en Buscar</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    checkAuth(['admin']);

    // Setear fecha de hoy por defecto
    document.getElementById('filterDate').value = new Date().toISOString().split('T')[0];

    document.getElementById('filterBtn').addEventListener('click', loadLogs);

    async function loadLogs() {
      const date = document.getElementById('filterDate').value;
      const eventType = document.getElementById('filterEvent').value;
      const tbody = document.getElementById('logsBody');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center"><div class="spinner-border spinner-border-sm text-primary" role="status"><span class="visually-hidden">Cargando...</span></div></td></tr>';

      let url = `/api/admin/logs?date=${date}`;
      if (eventType) url += `&eventType=${eventType}`;

      try {
        const res = await fetch(url);
        const logs = await res.json();

        if (!logs.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Sin registros para esta fecha.</td></tr>';
          return;
        }

        const eventColors = {
          LOGIN_SUCCESS: 'success', LOGIN_FAIL: 'danger', LOGOUT: 'secondary',
          BLOCKED: 'danger', SUSPICIOUS: 'warning', REQUEST: 'info'
        };

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td><small>${formatDateTime(l.log_time)}</small></td>
            <td>${l.username || l.user_id || '—'}</td>
            <td><span class="badge bg-${eventColors[l.event_type] || 'secondary'}">${l.event_type}</span></td>
            <td><small>${l.ip || '—'}</small></td>
            <td><small class="text-truncate d-inline-block" style="max-width:200px;">${l.device || '—'}</small></td>
            <td><small>${l.details || '—'}</small></td>
          </tr>`).join('');
      } catch {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error al cargar logs.</td></tr>';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
