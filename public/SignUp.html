<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <a href="inicio.html" class="text-decoration-none">
            <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
            <h2 class="navbar-brand mt-2">TEC Digitalito</h2>
          </a>
        </div>

        <div class="card">
          <div class="card-header text-center py-3">
            <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Crear Cuenta</h4>
          </div>
          <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Usuario <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="username" name="username"
                  placeholder="Nombre de usuario único" autocomplete="username"
                  aria-label="Nombre de usuario" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email"
                  placeholder="tu@correo.com" autocomplete="email"
                  aria-label="Correo electrónico" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" name="password"
                    placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número"
                    autocomplete="new-password" aria-label="Contraseña" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                    aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                  </button>
                </div>
                <div class="form-text">Mínimo 8 caracteres, al menos 1 mayúscula y 1 número.</div>
              </div>

              <div class="mb-3">
                <label for="fullName" class="form-label">Nombre completo <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="fullName" name="fullName"
                  placeholder="Nombre y apellidos" autocomplete="name"
                  aria-label="Nombre completo" required>
              </div>

              <div class="mb-3">
                <label for="birthDate" class="form-label">Fecha de nacimiento <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="birthDate" name="birthDate"
                  aria-label="Fecha de nacimiento" required>
              </div>

              <div class="mb-3">
                <label for="role" class="form-label">Tipo de cuenta <span class="text-danger">*</span></label>
                <select class="form-select" id="role" name="role"
                  aria-label="Tipo de cuenta">
                  <option value="student">Estudiante</option>
                  <option value="teacher">Docente</option>
                </select>
              </div>

              <div class="mb-4">
                <label for="avatar" class="form-label">Foto de perfil</label>
                <input type="file" class="form-control" id="avatar" name="avatar"
                  accept="image/*" aria-label="Foto de perfil">
              </div>

              <button type="submit" class="btn btn-primary w-100" id="submitBtn"
                aria-label="Crear cuenta">
                <span id="btnText">Crear cuenta</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"
                  role="status" aria-hidden="true"></span>
              </button>
            </form>

            <hr>
            <p class="text-center text-muted mb-0">
              ¿Ya tienes cuenta? <a href="SignIn.html">Inicia sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
