<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="profileContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const userId = getQueryParam('id');

    checkAuth().then(async currentUser => {
      const targetId = userId || currentUser.userId;
      const res = await fetch(`/api/users/${targetId}`);
      if (!res.ok) {
        document.getElementById('profileContainer').innerHTML = '<div class="alert alert-danger">Usuario no encontrado.</div>';
        return;
      }
      const profile = await res.json();
      const isOwnProfile = targetId === currentUser.userId;

      document.getElementById('profileContainer').innerHTML = `
        <div class="row g-4">
          <div class="col-md-4 text-center">
            <div class="mb-3">
              ${profile.avatarFileId
                ? `<img src="/api/files/${profile.avatarFileId}" alt="Foto de perfil de ${profile.fullName}" class="rounded-circle" style="width:120px;height:120px;object-fit:cover;">`
                : `<div class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center text-white" style="width:120px;height:120px;font-size:2.5rem;">${profile.fullName[0]}</div>`}
            </div>
            <h4>${profile.fullName}</h4>
            <p class="text-muted">@${profile.username}</p>
            <span class="badge badge-role-${profile.role}">${profile.role}</span>

            ${!isOwnProfile ? `
              <div class="mt-3">
                ${profile.isFriend
                  ? `<span class="badge bg-success p-2"><i class="bi bi-people-fill me-1"></i>Amigos</span>`
                  : profile.hasPendingRequest
                    ? `<span class="badge bg-warning text-dark p-2">Solicitud enviada</span>`
                    : `<button class="btn btn-outline-primary btn-sm" onclick="sendRequest('${profile.userId}')" aria-label="Agregar a ${profile.fullName} como amigo">
                        <i class="bi bi-person-plus me-1"></i>Agregar amigo
                      </button>`}
                <a href="messages.html" class="btn btn-outline-secondary btn-sm ms-1" aria-label="Enviar mensaje a ${profile.fullName}">
                  <i class="bi bi-chat me-1"></i>Mensaje
                </a>
              </div>
            ` : `
              <div class="mt-3">
                <a href="#changePassword" class="btn btn-outline-primary btn-sm">
                  <i class="bi bi-key me-1"></i>Cambiar contraseña
                </a>
              </div>
            `}
          </div>

          <div class="col-md-8">
            ${profile.isFriend || isOwnProfile ? `
              ${profile.enrolledCourses || isOwnProfile ? `
                <div class="card mb-3">
                  <div class="card-header"><h5 class="mb-0">Cursos matriculados</h5></div>
                  <div class="list-group list-group-flush" id="enrolledList">
                    <span class="list-group-item text-muted small">Cargando...</span>
                  </div>
                </div>
              ` : ''}
              ${profile.teachingCourses ? `
                <div class="card mb-3">
                  <div class="card-header"><h5 class="mb-0">Cursos que imparte</h5></div>
                  <div class="list-group list-group-flush">
                    ${profile.teachingCourses.length
                      ? profile.teachingCourses.map(c => `<a href="course-view.html?id=${c.courseId}" class="list-group-item list-group-item-action">${c.name}</a>`).join('')
                      : '<span class="list-group-item text-muted">Ninguno</span>'}
                  </div>
                </div>
              ` : ''}
            ` : `<div class="alert alert-info">Agrega a este usuario como amigo para ver su actividad.</div>`}

            ${isOwnProfile ? `
              <div class="card" id="changePassword">
                <div class="card-header"><h5 class="mb-0">Cambiar contraseña</h5></div>
                <div class="card-body">
                  <div id="pwAlertBox" class="alert d-none" role="alert" aria-live="polite"></div>
                  <div class="mb-2">
                    <label for="currentPassword" class="form-label">Contraseña actual</label>
                    <input type="password" class="form-control" id="currentPassword" aria-label="Contraseña actual">
                  </div>
                  <div class="mb-2">
                    <label for="newPassword" class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" id="newPassword" aria-label="Nueva contraseña">
                  </div>
                  <button class="btn btn-primary btn-sm" onclick="changePassword()" aria-label="Actualizar contraseña">
                    Actualizar
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>`;

      // Cargar cursos propios si es el perfil propio
      if (isOwnProfile) {
        fetch('/api/enrollment/my-courses').then(r => r.json()).then(courses => {
          const list = document.getElementById('enrolledList');
          if (!list) return;
          list.innerHTML = courses.length
            ? courses.map(c => `<a href="course-view.html?id=${c.courseId}" class="list-group-item list-group-item-action">${c.name}</a>`).join('')
            : '<span class="list-group-item text-muted">Ninguno</span>';
        });
      } else if (profile.enrolledCourses) {
        const list = document.getElementById('enrolledList');
        if (list) {
          list.innerHTML = profile.enrolledCourses.length
            ? profile.enrolledCourses.map(c => `<a href="course-view.html?id=${c.courseId}" class="list-group-item list-group-item-action">${c.name}</a>`).join('')
            : '<span class="list-group-item text-muted">Ninguno</span>';
        }
      }
    });

    async function sendRequest(toId) {
      const res = await fetch(`/api/users/${toId}/friend-request`, { method: 'POST' });
      if (res.ok) showToast('Solicitud de amistad enviada', 'success');
      else { const d = await res.json(); showToast(d.error || 'Error', 'danger'); }
    }

    async function changePassword() {
      const current = document.getElementById('currentPassword').value;
      const newPw = document.getElementById('newPassword').value;
      const alertBox = document.getElementById('pwAlertBox');
      const res = await fetch('/api/auth/change-password', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: current, newPassword: newPw })
      });
      const data = await res.json();
      alertBox.className = `alert alert-${res.ok ? 'success' : 'danger'}`;
      alertBox.textContent = data.message || data.error;
      alertBox.classList.remove('d-none');
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
