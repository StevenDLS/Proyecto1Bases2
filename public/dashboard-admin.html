<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard-admin.html">
        <i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito <span class="badge bg-danger ms-1">Admin</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-muted small" id="userGreeting"></span>
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-2 sidebar py-3 d-none d-md-block" aria-label="Navegación admin">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link active" href="dashboard-admin.html"><i class="bi bi-house"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-logs.html"><i class="bi bi-journal-text"></i> Logs del sistema</a></li>
          <li class="nav-item"><a class="nav-link" href="#users"><i class="bi bi-people"></i> Usuarios</a></li>
        </ul>
      </nav>

      <main class="col-md-10 py-4 px-4">
        <h3 class="mb-4">Panel de Administración</h3>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card text-center p-3">
              <i class="bi bi-people fs-1 text-primary"></i>
              <h5 class="mt-2">Usuarios registrados</h5>
              <p class="fs-3 fw-bold mb-0" id="totalUsers">—</p>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card text-center p-3">
              <i class="bi bi-journal-text fs-1 text-warning"></i>
              <h5 class="mt-2">Logs de hoy</h5>
              <a href="admin-logs.html" class="btn btn-outline-warning mt-2">Ver logs</a>
            </div>
          </div>
        </div>

        <h4 id="users" class="mb-3">Usuarios del sistema</h4>
        <div class="mb-3">
          <input type="text" class="form-control w-25" id="filterUsers"
            placeholder="Filtrar por nombre o usuario" aria-label="Filtrar usuarios">
        </div>
        <div class="table-responsive">
          <table class="table table-hover" id="usersTable">
            <thead class="table-light">
              <tr>
                <th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr><td colspan="5" class="text-center">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    checkAuth(['admin']).then(user => {
      document.getElementById('userGreeting').textContent = `Admin: ${user.username}`;
    });

    let allUsers = [];
    fetch('/api/admin/users')
      .then(r => r.json())
      .then(users => {
        allUsers = users;
        document.getElementById('totalUsers').textContent = users.length;
        renderUsers(users);
      });

    function renderUsers(users) {
      const tbody = document.getElementById('usersBody');
      if (!users.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center">Sin usuarios</td></tr>'; return; }
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.username}</td>
          <td>${u.fullName}</td>
          <td><span class="badge badge-role-${u.role}">${u.role}</span></td>
          <td><span class="badge bg-${u.blocked ? 'danger' : 'success'}">${u.blocked ? 'Bloqueado' : 'Activo'}</span></td>
          <td>
            <button class="btn btn-sm btn-${u.blocked ? 'success' : 'warning'}"
              onclick="toggleBlock('${u.userId}', ${!u.blocked})"
              aria-label="${u.blocked ? 'Desbloquear' : 'Bloquear'} usuario ${u.username}">
              <i class="bi bi-${u.blocked ? 'unlock' : 'lock'}"></i>
              ${u.blocked ? 'Desbloquear' : 'Bloquear'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('filterUsers').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderUsers(allUsers.filter(u =>
        u.username.toLowerCase().includes(q) || u.fullName.toLowerCase().includes(q)
      ));
    });

    async function toggleBlock(userId, blocked) {
      const res = await fetch(`/api/admin/users/${userId}/block`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ blocked })
      });
      if (res.ok) {
        const u = allUsers.find(x => x.userId === userId);
        if (u) u.blocked = blocked;
        renderUsers(allUsers);
        showToast(blocked ? 'Usuario bloqueado' : 'Usuario desbloqueado');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
