<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid" style="height: calc(100vh - 56px);">
    <div class="row h-100">
      <!-- Lista de hilos -->
      <div class="col-md-4 border-end overflow-auto py-3">
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <h5 class="mb-0">Mensajes</h5>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newThreadModal"
            aria-label="Crear nuevo mensaje">
            <i class="bi bi-pencil-square"></i>
          </button>
        </div>
        <div id="threadList">
          <div class="text-center py-3"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div></div>
        </div>
      </div>

      <!-- Vista del hilo -->
      <div class="col-md-8 d-flex flex-column py-3">
        <div id="threadView" class="flex-grow-1 overflow-auto">
          <div class="text-center text-muted py-5">
            <i class="bi bi-chat-dots fs-1"></i>
            <p class="mt-2">Selecciona una conversación para verla</p>
          </div>
        </div>
        <div id="replyArea" class="d-none mt-3">
          <div class="input-group">
            <textarea class="form-control" id="replyText" rows="2"
              placeholder="Escribe tu respuesta..." aria-label="Texto de respuesta"></textarea>
            <button class="btn btn-primary" id="sendReplyBtn" aria-label="Enviar respuesta">
              <i class="bi bi-send"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal nuevo hilo -->
  <div class="modal fade" id="newThreadModal" tabindex="-1" aria-labelledby="newThreadModalLabel">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newThreadModalLabel">Nuevo Mensaje</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="recipientInput" class="form-label">Destinatario (userId)</label>
            <input type="text" class="form-control" id="recipientInput" aria-label="ID del destinatario" placeholder="Busca un usuario...">
            <div id="userSuggestions" class="list-group mt-1"></div>
          </div>
          <div class="mb-3">
            <label for="threadSubject" class="form-label">Asunto</label>
            <input type="text" class="form-control" id="threadSubject" aria-label="Asunto del mensaje">
          </div>
          <div class="mb-3">
            <label for="threadContent" class="form-label">Mensaje</label>
            <textarea class="form-control" id="threadContent" rows="4" aria-label="Contenido del mensaje"></textarea>
          </div>
          <div id="selectedRecipient" class="d-none">
            <span class="badge bg-primary" id="recipientBadge"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="sendNewThread" aria-label="Enviar mensaje">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentUser, currentThreadId, selectedRecipientId;

    checkAuth().then(user => {
      currentUser = user;
      loadThreads();
    });

    async function loadThreads() {
      const res = await fetch('/api/messages');
      const threads = await res.json();
      const container = document.getElementById('threadList');
      if (!threads.length) {
        container.innerHTML = '<p class="text-muted text-center small p-3">Sin mensajes aún.</p>';
        return;
      }
      container.innerHTML = threads.map(t => {
        const lastMsg = t.messages[t.messages.length - 1];
        const hasUnread = t.messages.some(m => !m.readBy.includes(currentUser.userId));
        return `
          <div class="msg-thread p-3 border-bottom ${hasUnread ? 'unread' : ''}"
            onclick="loadThread('${t.threadId}')" role="button"
            aria-label="Hilo: ${t.subject || '(sin asunto)'}">
            <div class="d-flex justify-content-between">
              <strong>${t.subject || '(sin asunto)'}</strong>
              <small class="text-muted">${formatDate(t.lastMessageAt)}</small>
            </div>
            <p class="text-muted small mb-0 text-truncate">${lastMsg ? lastMsg.content : ''}</p>
          </div>`;
      }).join('');
    }

    async function loadThread(threadId) {
      currentThreadId = threadId;
      const res = await fetch(`/api/messages/${threadId}`);
      const thread = await res.json();
      const view = document.getElementById('threadView');
      view.innerHTML = `
        <h5 class="border-bottom pb-2 mb-3">${thread.subject || '(sin asunto)'}</h5>
        <div id="messages">
          ${thread.messages.map(m => {
            const isMine = m.senderId === currentUser.userId;
            return `
              <div class="d-flex ${isMine ? 'justify-content-end' : ''}">
                <div class="message-bubble ${isMine ? 'sent' : 'received'}">
                  <p class="mb-1">${m.content}</p>
                  <small class="text-muted">${formatDateTime(m.sentAt)}</small>
                </div>
              </div>`;
          }).join('')}
        </div>`;
      document.getElementById('replyArea').classList.remove('d-none');
      loadThreads();
    }

    document.getElementById('sendReplyBtn').addEventListener('click', async () => {
      const content = document.getElementById('replyText').value.trim();
      if (!content || !currentThreadId) return;
      const res = await fetch(`/api/messages/${currentThreadId}/reply`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if (res.ok) {
        document.getElementById('replyText').value = '';
        loadThread(currentThreadId);
      }
    });

    // Búsqueda de usuarios para nuevo hilo
    let searchTimeout2;
    document.getElementById('recipientInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout2);
      const q = e.target.value.trim();
      if (!q) { document.getElementById('userSuggestions').innerHTML = ''; return; }
      searchTimeout2 = setTimeout(async () => {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
        const users = await res.json();
        document.getElementById('userSuggestions').innerHTML = users.slice(0,5).map(u => `
          <a href="#" class="list-group-item list-group-item-action"
            onclick="selectRecipient('${u.userId}', '${u.username}'); return false;">
            ${u.fullName} (${u.username})
          </a>`).join('');
      }, 300);
    });

    function selectRecipient(userId, username) {
      selectedRecipientId = userId;
      document.getElementById('recipientInput').value = username;
      document.getElementById('userSuggestions').innerHTML = '';
      document.getElementById('recipientBadge').textContent = username;
      document.getElementById('selectedRecipient').classList.remove('d-none');
    }

    document.getElementById('sendNewThread').addEventListener('click', async () => {
      const content = document.getElementById('threadContent').value.trim();
      const subject = document.getElementById('threadSubject').value.trim();
      if (!selectedRecipientId || !content) {
        showToast('Selecciona un destinatario y escribe un mensaje', 'warning');
        return;
      }
      const res = await fetch('/api/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipientIds: [selectedRecipientId], subject, content })
      });
      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('newThreadModal')).hide();
        loadThreads();
        showToast('Mensaje enviado', 'success');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
