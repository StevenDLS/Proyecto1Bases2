<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
          <a href="inicio.html" class="text-decoration-none">
            <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
            <h2 class="navbar-brand mt-2">TEC Digitalito</h2>
          </a>
        </div>

        <div class="card">
          <div class="card-header text-center py-3">
            <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</h4>
          </div>
          <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" name="username"
                    placeholder="Ingresa tu usuario" autocomplete="username"
                    aria-label="Nombre de usuario" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password"
                    placeholder="Ingresa tu contraseña" autocomplete="current-password"
                    aria-label="Contraseña" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                    aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe"
                    aria-label="Recordarme en este dispositivo">
                  <label class="form-check-label" for="rememberMe">Recordarme</label>
                </div>
                <a href="forgot-password.html" class="text-sm">¿Olvidaste tu contraseña?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100" id="submitBtn"
                aria-label="Iniciar sesión">
                <span id="btnText">Iniciar sesión</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"
                  role="status" aria-hidden="true"></span>
              </button>
            </form>

            <hr>
            <p class="text-center text-muted mb-0">
              ¿No tienes cuenta? <a href="SignUp.html">Regístrate aquí</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
