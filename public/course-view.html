<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Curso — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar secciones -->
      <nav class="col-md-3 sidebar py-3" aria-label="Secciones del curso">
        <h6 class="px-3 text-muted text-uppercase fw-bold small">Secciones</h6>
        <ul class="nav flex-column" id="sectionNav">
          <li class="nav-item"><span class="nav-link text-muted">Cargando...</span></li>
        </ul>
      </nav>

      <!-- Contenido principal -->
      <main class="col-md-9 py-4 px-4">
        <div id="courseHeader" class="mb-4">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
          </div>
        </div>

        <div id="contentArea" class="d-none">
          <h4 id="sectionTitle"></h4>
          <div id="sectionContent"></div>
        </div>

        <div id="evaluationsArea" class="d-none mt-4">
          <h4 class="mb-3"><i class="bi bi-pencil-square me-2"></i>Evaluaciones</h4>
          <div id="evalsList"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const courseId = getQueryParam('id');
    if (!courseId) window.location.href = 'dashboard-student.html';

    checkAuth().then(async user => {
      const [courseRes, sectionsRes, evalsRes] = await Promise.all([
        fetch(`/api/courses/${courseId}`),
        fetch(`/api/sections/${courseId}/tree`),
        fetch(`/api/evaluations/${courseId}`)
      ]);

      if (!courseRes.ok) {
        document.getElementById('courseHeader').innerHTML = '<div class="alert alert-danger">Curso no encontrado o no tienes acceso.</div>';
        return;
      }

      const course = await courseRes.json();
      const sections = await sectionsRes.json();
      const evals = await evalsRes.json();

      // Header
      document.getElementById('courseHeader').innerHTML = `
        <div class="d-flex align-items-start gap-4">
          ${course.photoFileId ? `<img src="/api/files/${course.photoFileId}" alt="Foto del curso" style="width:100px;height:70px;object-fit:cover;border-radius:8px;">` : ''}
          <div>
            <h3>${course.name}</h3>
            <span class="badge bg-secondary me-1">${course.code}</span>
            <p class="text-muted mt-1">${course.description || ''}</p>
            <small class="text-muted">Docente: ${course.teacherName || '—'} | Inicio: ${formatDate(course.startDate)}</small>
          </div>
        </div>`;
      document.title = `${course.name} — TEC Digitalito`;

      // Secciones nav
      const nav = document.getElementById('sectionNav');
      if (!sections.length) {
        nav.innerHTML = '<li><span class="nav-link text-muted small">Sin secciones</span></li>';
      } else {
        nav.innerHTML = sections.map(s => `
          <li class="nav-item">
            <a class="nav-link ${s.depth > 1 ? 'ps-4' : ''} small"
              href="#" onclick="loadSection('${s.sectionId}', '${s.title.replace(/'/g,"\\'")}'); return false;"
              aria-label="Ver sección ${s.title}">
              ${'— '.repeat(s.depth - 1)}${s.title}
            </a>
          </li>`).join('');
      }

      // Evaluaciones
      if (evals.length) {
        document.getElementById('evaluationsArea').classList.remove('d-none');
        document.getElementById('evalsList').innerHTML = evals.map(e => {
          const now = new Date();
          const start = new Date(e.startDate);
          const end = new Date(e.endDate);
          const available = now >= start && now <= end;
          return `
            <div class="card mb-2">
              <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="mb-0">${e.title}</h6>
                  <small class="text-muted">${formatDate(e.startDate)} – ${formatDate(e.endDate)}</small>
                </div>
                ${available
                  ? `<a href="evaluation.html?id=${e.evaluationId}&courseId=${courseId}" class="btn btn-primary btn-sm" aria-label="Realizar evaluación ${e.title}">Realizar</a>`
                  : `<span class="badge bg-secondary">${now < start ? 'Próximamente' : 'Cerrada'}</span>`}
              </div>
            </div>`;
        }).join('');
      }

      // Ver estudiantes del curso
      if (['student'].includes(user.role)) {
        const studBtn = document.createElement('a');
        studBtn.href = `students.html?courseId=${courseId}`;
        studBtn.className = 'btn btn-outline-secondary btn-sm mt-2';
        studBtn.innerHTML = '<i class="bi bi-people me-1"></i>Ver estudiantes';
        studBtn.setAttribute('aria-label', 'Ver lista de estudiantes del curso');
        document.getElementById('courseHeader').appendChild(studBtn);
      }
    });

    async function loadSection(sectionId, title) {
      document.getElementById('contentArea').classList.remove('d-none');
      document.getElementById('sectionTitle').textContent = title;
      document.getElementById('sectionContent').innerHTML = '<div class="spinner-border spinner-border-sm text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>';

      const res = await fetch(`/api/content/${sectionId}`);
      const items = await res.json();

      if (!items.length) {
        document.getElementById('sectionContent').innerHTML = '<p class="text-muted">Esta sección no tiene contenido aún.</p>';
        return;
      }

      document.getElementById('sectionContent').innerHTML = items.sort((a,b) => a.order - b.order).map(item => {
        if (item.type === 'text') return `<div class="mb-3">${item.content}</div>`;
        if (item.type === 'image') return `<div class="mb-3"><img src="/api/files/${item.fileId}" alt="${item.filename}" class="img-fluid rounded"></div>`;
        if (item.type === 'video') return `<div class="mb-3"><video controls class="w-100 rounded" aria-label="Video: ${item.filename}"><source src="/api/files/${item.fileId}"></video></div>`;
        if (item.type === 'document') return `<div class="mb-3"><a href="/api/files/${item.fileId}" target="_blank" class="btn btn-outline-primary" aria-label="Descargar documento ${item.filename}"><i class="bi bi-file-earmark me-1"></i>${item.filename}</a></div>`;
        return '';
      }).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
