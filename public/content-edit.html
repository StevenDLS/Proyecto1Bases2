<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Contenido — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="javascript:history.back()"><i class="bi bi-mortarboard-fill me-2"></i>TEC Digitalito</a>
      <div class="ms-auto">
        <button class="btn btn-outline-danger btn-sm" id="logoutBtn" aria-label="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center mb-4">
      <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm me-3" aria-label="Volver">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="mb-0">Editar Contenido de Sección</h3>
    </div>

    <div class="row g-4">
      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-header"><h5 class="mb-0">Agregar texto</h5></div>
          <div class="card-body">
            <textarea class="form-control" id="textContent" rows="5"
              placeholder="Escribe el texto de la sección (HTML permitido)..."
              aria-label="Contenido de texto"></textarea>
            <button class="btn btn-primary mt-2" onclick="addText()" aria-label="Agregar texto">
              <i class="bi bi-plus me-1"></i>Agregar texto
            </button>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header"><h5 class="mb-0">Subir archivo</h5></div>
          <div class="card-body">
            <div class="mb-2">
              <label for="fileType" class="form-label">Tipo de contenido</label>
              <select class="form-select" id="fileType" aria-label="Tipo de archivo">
                <option value="document">Documento</option>
                <option value="image">Imagen</option>
                <option value="video">Video</option>
              </select>
            </div>
            <input type="file" class="form-control mb-2" id="fileInput" aria-label="Seleccionar archivo">
            <button class="btn btn-primary" onclick="uploadFile()" aria-label="Subir archivo">
              <i class="bi bi-upload me-1"></i>Subir
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Contenido actual</h5>
            <button class="btn btn-sm btn-outline-light" onclick="loadContent()" aria-label="Recargar">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
          <div class="list-group list-group-flush" id="contentList">
            <span class="list-group-item text-muted small">Cargando...</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    const sectionId = getQueryParam('sectionId');
    const courseId = getQueryParam('courseId');
    if (!sectionId) window.location.href = 'dashboard-teacher.html';

    checkAuth(['teacher', 'admin']);
    loadContent();

    async function loadContent() {
      const res = await fetch(`/api/content/${sectionId}`);
      const items = await res.json();
      const list = document.getElementById('contentList');
      if (!items.length) {
        list.innerHTML = '<span class="list-group-item text-muted small">Sin contenido aún.</span>';
        return;
      }
      list.innerHTML = items.sort((a,b) => a.order - b.order).map((item, idx) => `
        <div class="list-group-item">
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge bg-${item.type === 'text' ? 'primary' : item.type === 'image' ? 'success' : item.type === 'video' ? 'danger' : 'warning'} me-2">
              ${item.type}
            </span>
            <span class="small text-truncate flex-grow-1">${item.filename || item.content?.substring(0,30) || '—'}</span>
          </div>
        </div>`).join('');
    }

    async function addText() {
      const content = document.getElementById('textContent').value.trim();
      if (!content) return;
      // Obtener contenido actual y agregar el nuevo item de texto
      const currentRes = await fetch(`/api/content/${sectionId}`);
      const items = await currentRes.json();
      items.push({ type: 'text', content, order: items.length });
      const res = await fetch(`/api/content/${sectionId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      if (res.ok) {
        document.getElementById('textContent').value = '';
        loadContent();
        showToast('Texto agregado', 'success');
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const type = document.getElementById('fileType').value;
      if (!fileInput.files[0]) { showToast('Selecciona un archivo', 'warning'); return; }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('type', type);

      const res = await fetch(`/api/content/${sectionId}/upload`, {
        method: 'POST', body: formData
      });
      if (res.ok) {
        fileInput.value = '';
        loadContent();
        showToast('Archivo subido', 'success');
      } else {
        const d = await res.json();
        showToast(d.error || 'Error al subir', 'danger');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
