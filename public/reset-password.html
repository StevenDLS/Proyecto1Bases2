<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña — TEC Digitalito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card">
          <div class="card-header text-center py-3">
            <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Nueva Contraseña</h4>
          </div>
          <div class="card-body p-4">
            <div id="alertBox" class="alert d-none" role="alert" aria-live="polite"></div>
            <form id="resetForm">
              <div class="mb-3">
                <label for="newPassword" class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" id="newPassword"
                  placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número"
                  aria-label="Nueva contraseña" required>
                <div class="form-text">Mínimo 8 caracteres, al menos 1 mayúscula y 1 número.</div>
              </div>
              <button type="submit" class="btn btn-primary w-100" aria-label="Restablecer contraseña">
                Restablecer contraseña
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) { window.location.href = 'SignIn.html'; }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const alertBox = document.getElementById('alertBox');
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = data.message + ' Redirigiendo...';
          alertBox.classList.remove('d-none');
          setTimeout(() => window.location.href = 'SignIn.html', 2000);
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = data.error || 'Error al restablecer';
          alertBox.classList.remove('d-none');
        }
      } catch {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Error de conexión';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
