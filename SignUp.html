<!DOCTYPE html>
<html>
    <head>
        <Title>
            Registrarse
        </Title>
        <style>
            body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;     
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #333;
        }

        .botones {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
        </style>
    </head>
    <body>
        <h1>Registrarse</h1>
        <div class="infoup">
            <form id="signupForm">
                <label>Usuario: </label><br>
                <input type="text" name="usuario" required><br><br>

                <label>Contraseña:</label><br>
                <input type="password" name="clave" required><br><br>

                <label>Nombre</label><br>
                <input type="text" name="name" required><br><br>

                <label>Apellidos</label><br>
                <input type="text" name="lnames" required><br><br>

                <label>Fecha de nacimiento</label><br>
                <input type="datetime" name="fecnacim" required><br><br>

                <label>Foto de perfil</label><br>
                <input type="file" id="foto" accept="image/*" required><br><br>

                <button type="submit">Registrar</button>
            </form><br>
            <button onclick="window.location.href='inicio.html'">Volver</button><br><br>
        </div>
    </body>
</html>
